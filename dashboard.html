<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiTi — Kho Game Toán & Tiếng Anh</title><style>body{margin:0;font-family:system-ui;background:#07111f;color:#f7f9fc}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#ffd84d,#43e6ff);color:#07111f;display:grid;place-items:center;font-weight:900}.brand h2{margin:0}.brand p{margin:2px 0;color:#9fb0c5}.stats{display:flex;gap:8px}.stat{background:#0d1b2e;border:1px solid #29425f;border-radius:12px;padding:8px 12px}.hero,.bar,.card{background:#0d1b2e;border:1px solid #29425f;border-radius:18px}.hero{padding:24px;margin:20px 0}.hero h1{margin:0 0 8px}.hero p{color:#c1cddd;line-height:1.6}.bar{padding:14px;margin-bottom:16px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.bar input,.bar select{background:#091625;color:#fff;border:1px solid #29425f;border-radius:10px;padding:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.tab{background:#0d1b2e;color:#c6d2df;border:1px solid #29425f;border-radius:10px;padding:9px 13px;font-weight:800}.tab.active{background:#43e6ff;color:#07111f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{padding:17px;display:flex;flex-direction:column;min-height:300px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#18304b;color:#9fefff;font-size:11px;font-weight:900}.card h3{font-size:20px;margin:11px 0}.box{background:#091625;border:1px solid #1d344b;padding:10px;border-radius:12px;margin-top:8px}.box b{display:block;margin-bottom:3px}.muted{color:#a8b6c7;font-size:13px;line-height:1.5}.actions{margin-top:auto;display:flex;gap:8px;padding-top:12px}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:#43e6ff;color:#07111f}.secondary{background:#16283d;color:#dce8f5}.empty{text-align:center;padding:35px;color:#9fb0c5}@media(max-width:850px){.bar{grid-template-columns:1fr 1fr}}@media(max-width:560px){.bar{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><div class="logo">MiTi</div><div><h2>MiTi</h2><p>Thư viện Prompt Game Giáo Dục</p></div></div><div class="stats"><div class="stat">🎮 <b id="total">0</b></div><div class="stat">📐 <b id="math">0</b></div><div class="stat">🔤 <b id="eng">0</b></div></div></header><section class="hero"><h1>🎮 Dashboard Game Toán & Tiếng Anh lớp 4–5</h1><p>Chọn game để xem <b>mục tiêu học tập, nhiệm vụ, điều khiển và chức năng</b>. Prompt được thiết kế độc lập để copy toàn bộ vào Gemini Canvas và tạo game.</p></section><div class="bar"><input id="q" placeholder="🔎 Tìm game, mục tiêu, nhiệm vụ..."><select id="grade"><option value="">Tất cả khối</option><option value="4">Lớp 4</option><option value="5">Lớp 5</option></select><select id="subject"><option value="">Tất cả môn</option><option value="Toán">Toán</option><option value="English">Tiếng Anh</option></select><select id="control"><option value="">Tất cả điều khiển</option></select></div><div class="tabs"><button class="tab active" data-v="all">Tất cả</button><button class="tab" data-v="m4">Toán 4</button><button class="tab" data-v="m5">Toán 5</button><button class="tab" data-v="e4">Tiếng Anh 4</button><button class="tab" data-v="e5">Tiếng Anh 5</button></div><main id="grid" class="grid"></main><div id="empty" class="empty" hidden>Không tìm thấy game.</div></div><script>
let games=[],view='all';
function parseCSV(t){const ls=t.trim().split(/\r?\n/),out=[];for(let i=1;i<ls.length;i++){let a=[],c='',q=false;for(let j=0;j<ls[i].length;j++){let x=ls[i][j];if(x==='"'&&ls[i][j+1]==='"'){c+='"';j++;continue}if(x==='"'){q=!q;continue}if(x===','&&!q){a.push(c);c='';continue}c+=x}a.push(c);if(a.length>=9)out.push({id:a[0],game:a[1],grade:a[2],subject:a[3],objective:a[4],mission:a[5],control:a[6],functions:a[7],prompt:a[8]})}return out}
function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]))}
function mv(g){return view==='all'||(view==='m4'&&g.subject==='Toán'&&g.grade==='4')||(view==='m5'&&g.subject==='Toán'&&g.grade==='5')||(view==='e4'&&g.subject==='English'&&g.grade==='4')||(view==='e5'&&g.subject==='English'&&g.grade==='5')}
function render(){const q=document.getElementById('q').value.toLowerCase(),gr=document.getElementById('grade').value,su=document.getElementById('subject').value,co=document.getElementById('control').value;const list=games.filter(g=>mv(g)&&(!gr||g.grade===gr)&&(!su||g.subject===su)&&(!co||g.control===co)&&[g.id,g.game,g.objective,g.mission,g.functions].join(' ').toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map(g=>'<article class="card"><div><span class="badge">'+esc(g.subject)+' • Lớp '+esc(g.grade)+'</span><h3>'+esc(g.id)+' — '+esc(g.game)+'</h3><div class="box"><b>🎯 Mục tiêu</b><div class="muted">'+esc(g.objective)+'</div></div><div class="box"><b>🕹️ Nhiệm vụ</b><div class="muted">'+esc(g.mission)+'</div></div><div class="box"><b>👋 Điều khiển</b><div class="muted">'+esc(g.control)+'</div></div><div class="box"><b>⚙️ Chức năng</b><div class="muted">'+esc(g.functions)+'</div></div></div><div class="actions"><button class="btn primary" onclick="location.href=\''+esc(g.prompt)+'\'">📋 Mở Prompt</button></div></article>').join('');document.getElementById('empty').hidden=list.length>0;document.getElementById('total').textContent=games.length;document.getElementById('math').textContent=games.filter(x=>x.subject==='Toán').length;document.getElementById('eng').textContent=games.filter(x=>x.subject==='English').length}
fetch('catalogs/GAME_CATALOG.csv').then(r=>r.text()).then(t=>{games=parseCSV(t);let cs=[...new Set(games.map(g=>g.control))].sort();document.getElementById('control').innerHTML='<option value="">Tất cả điều khiển</option>'+cs.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');render();});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.v;render()});['q','grade','subject','control'].forEach(id=>{document.getElementById(id).addEventListener('input',render);document.getElementById(id).addEventListener('change',render)});
</script></body></html>
